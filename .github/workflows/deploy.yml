name: Test and Deploy Lambda

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  test-and-deploy:
    name: Test and Deploy
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-2
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -v

      - name: Prepare deployment directories
        run: |
          mkdir -p dist
          mkdir -p build/create_order
          mkdir -p build/process_order

      - name: Package create-order Lambda
        run: |
          python -m pip install -r requirements.txt -t build/create_order
          cp lambdas/create_order/lambda_function.py build/create_order/
          cd build/create_order
          zip -qr ../../dist/create-order.zip .

      - name: Package process-order Lambda
        run: |
          python -m pip install -r requirements.txt -t build/process_order
          cp lambdas/process_order/lambda_function.py build/process_order/
          cd build/process_order
          zip -qr ../../dist/process-order.zip .

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::775698064192:role/GitHubActions-ServerlessOrderDeploymentRole
          aws-region: ap-south-2

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Deploy create-order Lambda
        run: |
          aws lambda update-function-code \
            --function-name serverless-order-create-order \
            --zip-file fileb://dist/create-order.zip \
            --region ap-south-2

          aws lambda wait function-updated \
            --function-name serverless-order-create-order \
            --region ap-south-2

      - name: Deploy process-order Lambda
        run: |
          aws lambda update-function-code \
            --function-name serverless-order-process-order \
            --zip-file fileb://dist/process-order.zip \
            --region ap-south-2

          aws lambda wait function-updated \
            --function-name serverless-order-process-order \
            --region ap-south-2

      - name: Verify Lambda deployments
        run: |
          aws lambda get-function-configuration \
            --function-name serverless-order-create-order \
            --region ap-south-2 \
            --query '{Function:FunctionName,State:State,LastUpdateStatus:LastUpdateStatus,LastModified:LastModified}' \
            --output table

          aws lambda get-function-configuration \
            --function-name serverless-order-process-order \
            --region ap-south-2 \
            --query '{Function:FunctionName,State:State,LastUpdateStatus:LastUpdateStatus,LastModified:LastModified}' \
            --output table